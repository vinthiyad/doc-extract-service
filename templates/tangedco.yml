# Template for TANGEDCO (Tamil Nadu Electricity Board) invoices
issuer: "TANGEDCO"
keywords:
  - "TANGEDCO"
  - "Tamil Nadu Generation"
  - "Electricity"
fields:
  invoice_number: "Bill\\s*No\\.?\\s*(\\S+)"
  date: "Bill\\s*Date\\s*[:.]?\\s*(\\d{2}/\\d{2}/\\d{4})"
  due_date: "Due\\s*Date\\s*[:.]?\\s*(\\d{2}/\\d{2}/\\d{4})"
  amount: "Total\\s*Amount\\s*[:.]?\\s*[₹$]?\\s*([\\d,]+\\.\\d{2})"
  gstin: "\\d{2}[A-Z]{5}\\d{4}[A-Z]{1}[A-Z\\d]{1}Z[A-Z\\d]{1}"